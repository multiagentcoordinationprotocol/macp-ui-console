# Full-stack E2E test environment for the MACP UI Console.
# Starts all backend services so Playwright can test the UI against real APIs.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml up -d --build --wait
#   npm run test:e2e
#   docker compose -f docker-compose.e2e.yml down -v

services:
  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    ports:
      - "3200:3200"
    environment:
      PORT: "3200"
      MACP_AUTH_ISSUER: macp-auth-service
      MACP_AUTH_AUDIENCE: macp-runtime
      MACP_AUTH_MAX_TTL_SECONDS: "3600"
      MACP_AUTH_DEFAULT_TTL_SECONDS: "300"
      # MACP_AUTH_SIGNING_KEY_JSON: unset → ephemeral key (dev only)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3200/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: macp_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ../macp-control-plane
      dockerfile: Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
        NPM_TOKEN: ${NODE_AUTH_TOKEN:-}
    command: node dist/db/migrate.js
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/macp_e2e
    depends_on:
      postgres:
        condition: service_healthy

  runtime:
    # Pinned to runtime v0.8.0 by its commit SHA tag, matching macp-control-plane's
    # docker-compose.test.yml and macp-playground's docker-compose.fullstack.yml byte for byte —
    # running this stack against an older runtime behind a control plane built and tested against
    # v0.8.0 is the drift this pin exists to remove.
    #
    # The SHA tag, not a semver one: the runtime repo moved to per-crate tags, so there is no
    # `v0.8.0` monolithic tag and `macp-runtime:0.8.0` is not a published image.
    #
    # Override with MACP_RUNTIME_IMAGE for local builds
    # (e.g. `export MACP_RUNTIME_IMAGE=macp-runtime:latest`).
    image: ${MACP_RUNTIME_IMAGE:-ghcr.io/multiagentcoordinationprotocol/macp-runtime:f97fd15}
    ports:
      - "50051:50051"
      # Runtime Prometheus metrics (opt-in via MACP_METRICS_ADDR below). Harmless until
      # a consumer scrapes it; lets `curl localhost:9464/metrics` return runtime series.
      - "9464:9464"
    environment:
      MACP_BIND_ADDR: "[::]:50051"
      # The published runtime image does not bake MACP_ALLOW_INSECURE — load-bearing, keep it.
      MACP_ALLOW_INSECURE: "1"
      # Expose per-mode runtime counters (macp_messages_*, macp_sessions_*, macp_commitments_*,
      # macp_replay_mismatches_total) as Prometheus text on :9464.
      MACP_METRICS_ADDR: "0.0.0.0:9464"
      # Static bearer kept so control-plane (tok-cp-observer) still authenticates.
      # JWT bearer added so spawned agents authenticate with auth-service-minted JWTs.
      MACP_AUTH_TOKENS_JSON: '{"tokens":[{"token":"tok-cp-observer","sender":"macp-control-plane","can_start_sessions":false,"is_observer":true,"can_manage_mode_registry":false}]}'
      MACP_AUTH_JWKS_URL: "http://auth-service:3200/.well-known/jwks.json"
      MACP_AUTH_AUDIENCE: "macp-runtime"
      MACP_AUTH_ISSUER: "macp-auth-service"
      MACP_AUTH_JWKS_TTL_SECS: "60"
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/50051'"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  macp-control-plane:
    build:
      context: ../macp-control-plane
      dockerfile: Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
        NPM_TOKEN: ${NODE_AUTH_TOKEN:-}
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/macp_e2e
      DB_POOL_MAX: "10"
      RUNTIME_KIND: rust
      RUNTIME_ADDRESS: runtime:50051
      RUNTIME_TLS: "false"
      RUNTIME_ALLOW_INSECURE: "true"
      # JWT mode (preferred): the credential resolver mints a short-lived
      # JWT for sender=control-plane via auth-service. RUNTIME_BEARER_TOKEN
      # remains as a fallback for the rare case auth-service is unreachable.
      MACP_AUTH_SERVICE_URL: "http://auth-service:3200"
      MACP_AUTH_SERVICE_TIMEOUT_MS: "5000"
      MACP_AUTH_TOKEN_TTL_SECONDS: "3600"
      MACP_AUTH_TOKEN_SENDER: "macp-control-plane"
      # Let the control-plane register/unregister runtime policies on behalf of
      # the console's admin UI. Requires macp-control-plane PR #29 (the minter
      # honours this flag); older images ignore it. See also the static
      # observer token below — JWT mode (MACP_AUTH_SERVICE_URL) takes precedence.
      MACP_AUTH_TOKEN_CAN_MANAGE_REGISTRY: "true"
      RUNTIME_BEARER_TOKEN: "tok-cp-observer"
      AUTH_API_KEYS: ""
      SESSION_DISCOVERY_ENABLED: "true"
      # Pagination/budget knobs for the runtime `listSessions` sweep that backs the Infrastructure
      # tab's session-drift table. Left commented so the control plane uses its own defaults.
      #
      # These are how you make the drift table's `complete: false` branch observable by hand: the
      # control plane reports an incomplete sweep when its overall budget runs out between pages,
      # mid-page, or when the page cap is hit. Setting the timeout to 1ms gets you there without
      # needing any sessions at all — but via the MID-PAGE branch, not the between-pages one: the
      # deadline clamps the gRPC call, which then fails DEADLINE_EXCEEDED. (The between-pages check
      # sees `remainingMs === 1`, not 0, so it does not fire on the opening iteration.)
      #
      # Footgun: each of those failures counts against the shared CircuitBreaker (threshold 5,
      # consecutive, 30s reset). Five sweeps in a row with no intervening successful runtime call
      # open it, after which `listSessions` THROWS instead of returning `complete: false` and
      # /readyz reports circuitBreaker OPEN. Unset the var once you have seen the branch.
      #
      # Trap worth knowing: unset falls back to the default, but an EMPTY STRING fails startup.
      # Comment the line out; do not blank it.
      # RUNTIME_LIST_SESSIONS_PAGE_SIZE: "200"
      # RUNTIME_LIST_SESSIONS_MAX_PAGES: "200"
      # RUNTIME_LIST_SESSIONS_TIMEOUT_MS: "60000"
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
      OTEL_SERVICE_NAME: "macp-control-plane"
      STREAM_SSE_HEARTBEAT_MS: "10000"
      STREAM_MAX_RETRIES: "30"
      STREAM_BACKOFF_BASE_MS: "1000"
      RUN_RECOVERY_ENABLED: "false"
      THROTTLE_LIMIT: "10000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      runtime:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: >-
        node -e "require('http').get('http://localhost:3001/healthz',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  macp-playground:
    build:
      context: ../macp-playground
      dockerfile: Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    ports:
      - "3100:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: development
      PACKS_DIR: /app/packs
      AUTO_BOOTSTRAP_EXAMPLE_AGENTS: "true"
      MACP_RUNTIME_ADDRESS: "runtime:50051"
      MACP_RUNTIME_TLS: "false"
      MACP_RUNTIME_ALLOW_INSECURE: "true"
      MACP_AUTH_SERVICE_URL: "http://auth-service:3200"
      MACP_AUTH_SERVICE_TIMEOUT_MS: "5000"
      MACP_AUTH_TOKEN_TTL_SECONDS: "3600"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      AUTH_API_KEYS: ""
      LOG_LEVEL: info
      REGISTRY_CACHE_TTL_MS: "0"
      # Without these the playground's control-plane submission is a no-op, so /examples/run never
      # returns `controlPlaneRun` and every real-mode bootstrap from /runs/new takes the
      # "not registered" branch — the feature would look broken in the only stack that exercises it.
      MACP_CONTROL_PLANE_URL: "http://macp-control-plane:3001"
      # Required even though the control plane runs with AUTH_API_KEYS: "". Its guard rejects a
      # *missing* Authorization header before it ever reaches the empty-keys bypass, so an unset key
      # yields 401 and the same silent no-op. Any non-empty value works while AUTH_API_KEYS is empty.
      # `npm run local:up` layers docker-compose.local.yml over this file, which sets its own
      # "local-dev" value here; only the URL above was actually missing from that path.
      MACP_CONTROL_PLANE_API_KEY: "e2e-test"
    depends_on:
      auth-service:
        condition: service_healthy
      runtime:
        condition: service_healthy
      macp-control-plane:
        condition: service_healthy
    healthcheck:
      test: >-
        node -e "require('http').get('http://localhost:3000/healthz',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
