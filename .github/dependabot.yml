version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "typescript"      # TS 7 major
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"          # eslint 10 needs the eslint-CLI migration
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"    # icon lib major (0.x -> 1.x)
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
