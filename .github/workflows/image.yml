name: Container image

# W3.7 — publishes ghcr.io/multiagentcoordinationprotocol/macp-ui-console.
#   push to main      → sha-<short>
#   tag vX.Y.Z        → vX.Y.Z, vX.Y, X.Y.Z, X.Y, latest (not for pre-releases), sha-<short>, plus a GitHub Release
#   pull request      → build + scan only, nothing is pushed
# The Vercel deployment is unaffected: it builds from Git on its own.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - next.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/image.yml
  workflow_dispatch:
    inputs:
      retag:
        description: 'Existing vX.Y.Z image to also tag as bare X.Y.Z and X.Y (same digest, no rebuild)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    if: inputs.retag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Warn on package.json / tag version drift
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::warning::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Bump package.json before the next release."
          fi

      - name: Set up QEMU (arm64)
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-,format=short

      # Build locally first so Trivy gates BEFORE anything reaches the registry.
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (release gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:scan-target
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Smoke test (serves, proxy reads runtime env)
        run: |
          docker run -d --name ui -p 3000:3000 \
            -e MACP_CONTROL_PLANE_BASE_URL=http://127.0.0.1:9 \
            -e MACP_PLAYGROUND_BASE_URL=http://127.0.0.1:9 \
            ghcr.io/${{ github.repository }}:scan-target
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:3000/runs/new
          # Not on the allow-list: refused before any upstream is contacted.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://127.0.0.1:3000/api/proxy/macp-control-plane/runs/x)" = 403
          docker rm -f ui

      # amd64 is cached from the scan build; arm64 builds under QEMU.
      - name: Push image (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)

  # Adds bare tags to an image published before they existed (v0.2.0). imagetools copies the
  # existing multi-arch index, so the digest does not change.
  retag:
    if: inputs.retag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag bare X.Y.Z and X.Y
        env:
          SOURCE: ${{ inputs.retag }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          [[ "$SOURCE" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::retag must be vX.Y.Z"; exit 1; }
          BARE="${SOURCE#v}"
          MINOR="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          docker buildx imagetools create -t "$IMAGE:$BARE" -t "$IMAGE:$MINOR" "$IMAGE:$SOURCE"
          docker buildx imagetools inspect "$IMAGE:$BARE" | head -3
