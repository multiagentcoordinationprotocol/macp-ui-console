name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Enable invocation as a reusable workflow (e.g. deploy.yml calls this
  # via `uses: ./.github/workflows/ci.yml`). Without this trigger GitHub
  # rejects the caller at workflow-load time.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Lint, Type-check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Doppler sync script tests (offline)
        run: |
          shellcheck deploy/doppler-sync.sh
          python3 scripts/test_doppler_sync.py

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_MACP_UI_DEMO_MODE: 'true'

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next/
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    # Runs on every push and PR. The suite drives the real proxy route handler and API client against
    # in-process mock backends (test/integration/helpers/mock-backend.ts): no stack, no secrets, about a
    # second. It used to be opt-in (workflow_dispatch input or a `run-integration-tests` label) and so
    # never ran here; the files only ran by accident inside `npm test`, under jsdom instead of the node
    # environment vitest.integration.config.ts sets. vitest.config.ts now excludes them from that run.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
